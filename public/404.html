<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>404 | Omid</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: 'Chivo Mono', monospace;
			background: #282C33;
			color: #FFFFFF;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
			padding: 2rem;
		}

		p { color: #ABB2BF; font-size: 1.25rem; margin: 0 0 2rem; }

			color: #C778DD;
			text-decoration: none;
			border: 1px solid #C778DD;
			padding: 0.5rem 1.5rem;
			font-weight: 700;
			transition: 0.3s;

		a:hover { background: #C778DD; color: #282C33; }
