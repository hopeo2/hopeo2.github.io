<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#282c33" />
		<title>Page not found | Omid</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				box-sizing: border-box;
			}

			html {
				color-scheme: dark;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background-color: #282c33;
				background-image:
					radial-gradient(ellipse 80% 50% at 50% -10%, rgba(199, 120, 221, 0.14), transparent 65%),
					linear-gradient(to right, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
					linear-gradient(to bottom, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
				background-size: auto, 2rem 2rem, 2rem 2rem;
				color: #ffffff;
				font-family: "Chivo Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
				-webkit-font-smoothing: antialiased;
			}

			main {
				width: 100%;
				max-width: 42rem;
			}

			.eyebrow {
				margin: 0 0 1rem;
				color: #abb2bf;
				font-size: 0.6875rem;
				font-weight: 500;
				letter-spacing: 0.18em;
				text-transform: uppercase;
			}

			.eyebrow span {
				color: #c778dd;
			}

			h1 {
				margin: 0;
				max-width: 18ch;
				font-size: clamp(2.5rem, 8vw, 4.5rem);
				line-height: 1;
				letter-spacing: -0.045em;
				text-wrap: balance;
			}

			p {
				max-width: 60ch;
				margin: 1.25rem 0 0;
				color: #abb2bf;
				font-size: 0.9375rem;
				line-height: 1.75;
				text-wrap: pretty;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
				margin-top: 2rem;
			}

			a {
				display: inline-flex;
				min-height: 2.75rem;
				align-items: center;
				justify-content: center;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 0.375rem;
				padding: 0 1.25rem;
				color: #ffffff;
				font-size: 0.875rem;
				font-weight: 600;
				text-decoration: none;
				transition: background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
			}

			a:hover {
				border-color: rgba(199, 120, 221, 0.35);
				background-color: #2e333c;
				color: #c778dd;
			}

			a.primary {
				border-color: #c778dd;
				background-color: #c778dd;
				color: #1e2229;
			}

			a.primary:hover {
				background-color: #d79ae8;
				color: #1e2229;
			}

			a:focus-visible {
				outline: 2px solid #c778dd;
				outline-offset: 3px;
			}

			a.primary:focus-visible {
				outline-color: #ffffff;
			}

			.brand {
				display: inline-flex;
				align-items: center;
				gap: 0.625rem;
				margin-bottom: 2.5rem;
				font-size: 0.875rem;
				font-weight: 700;
				color: #ffffff;
				border: 0;
				padding: 0;
				min-height: auto;
			}

			.brand:hover {
				background: none;
				color: #ffffff;
			}

			.brand-mark {
				display: inline-flex;
				width: 2rem;
				height: 2rem;
				align-items: center;
				justify-content: center;
				border: 1px solid rgba(199, 120, 221, 0.35);
				border-radius: 0.375rem;
				background-color: rgba(199, 120, 221, 0.12);
				color: #c778dd;
			}
		</style>
	</head>
	<body>
		<main>
			<a class="brand" href="/" aria-label="Omid — home">
				<span class="brand-mark" aria-hidden="true">O</span>
				Omid
			</a>
			<p class="eyebrow"><span aria-hidden="true">#</span> 404 / Not found</p>
			<h1>This page took a wrong turn.</h1>
			<p>
				The page you are looking for does not exist, or it has moved. Try one of
				the routes below instead.
			</p>
			<div class="actions">
				<a class="primary" href="/">Back home</a>
				<a href="/projects">View projects</a>
				<a href="/contact">Contact</a>
			</div>
		</main>
	</body>
</html>
